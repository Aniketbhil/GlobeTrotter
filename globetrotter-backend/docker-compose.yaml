services:
  db:
    image: postgres:16-alpine
    container_name: globetrotter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_DB: globetrotter
    ports:
      - "5432:5432"
    volumes:
      - globetrotter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d globetrotter"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: globetrotter-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@globetrotter.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  globetrotter_pgdata:
